version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: safecity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safecity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-safecity}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safecity"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safecity_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safecity_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-safecity}:${POSTGRES_PASSWORD:-change_me_dev_only}@postgres:5432/${POSTGRES_DB:-safecity}
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./evidence:/app/evidence

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: safecity_ai_engine
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    environment:
      - API_URL=http://backend:8000
      - REDIS_URL=redis://redis:6379/0
      - AI_ENGINE_HOST=0.0.0.0
      - AI_ENGINE_PORT=8001
      - DEVICE=cpu
    ports:
      - "8001:8001"
    volumes:
      - ./videos:/app/videos
      - ./evidence:/app/evidence

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safecity_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WEBSOCKET_URL=ws://localhost:8000/ws/events
      - NEXT_PUBLIC_AI_ENGINE_URL=http://localhost:8001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
